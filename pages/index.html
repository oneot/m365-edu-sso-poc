<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>로그인 · 학교 SSO (PoC)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/login.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234350dd'/%3E%3Cpath d='M9 19l7-7 7 7' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body data-mode="pages">
  <main class="card">
    <section class="form-side">
      <h1>로그인</h1>
      <p class="context" id="context" hidden></p>
      <p class="alert" id="alert" role="alert" hidden></p>
      <form id="loginForm" method="post" action="https://auth.joowon.me/login" autocomplete="on">
        <input type="hidden" name="k" id="k" value="">
        <label for="username">아이디</label>
        <div class="field">
          <input id="username" name="username" placeholder="아이디를 입력해 주세요." autocomplete="username"
                 autocapitalize="none" spellcheck="false" required>
          <span class="suffix">@joowon.me</span>
        </div>
        <label for="password">비밀번호</label>
        <div class="field">
          <input id="password" name="password" type="password" placeholder="비밀번호를 입력해 주세요."
                 autocomplete="current-password" required>
          <button type="button" class="eye" id="togglePw" aria-label="비밀번호 보기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/>
            </svg>
          </button>
        </div>
        <button type="submit" class="primary">로그인</button>
      </form>
      <p class="note">PoC 테스트 전용 로그인 화면입니다.<br>실제 업무 계정의 비밀번호는 입력하지 마세요.</p>
    </section>
    <aside class="art-side" aria-hidden="true">
      <div class="brand">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#4350dd"/><path d="M9 19l7-7 7 7" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        학교 SSO <span class="tag">PoC</span>
      </div>
      <img src="assets/illustration.svg" alt="">
    </aside>
  </main>
  <script src="assets/login.js"></script>
</body>
</html>
