{% extends "_layout.html" %}
{% block title %}Microsoft 365로 이동 중{% endblock %}
{% block body %}
<main class="sheet">
  <h1>Microsoft 365로 이동하고 있습니다</h1>
  <p class="sub">잠시만 기다려 주세요. 자동으로 넘어가지 않으면 아래 버튼을 누르세요.</p>
  <form id="samlForm" method="post" action="{{ action }}">
    {% for name, value in fields.items() %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
    <button class="primary" type="submit">계속</button>
  </form>
</main>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='autosubmit.js') }}"></script>{% endblock %}
