{% extends "_layout.html" %}
{% block title %}Microsoft 365로 이동 중{% endblock %}
{% block body %}
<div class="glass card">
  {% include "_logo.html" %}
  <form class="post" id="samlForm" method="post" action="{{ action }}">
    {% for name, value in fields.items() %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
    <span class="spinner" aria-hidden="true"></span>
    <p class="post-text" role="status">Microsoft 365로 이동하고 있습니다</p>
    <button class="chip later" type="submit">계속</button>
  </form>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='autosubmit.js') }}"></script>{% endblock %}
